<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Probability Reversal Task</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="instructions" class="card tutorial-card">
      <p id="tutorialProgress" class="tutorial-progress">1 of 4</p>
      <h1>How it works</h1>
      <p id="tutorialText" class="tutorial-text">You’ll be given the option of an apple or a banana. Your goal is to collect as many gold coins as possible. Click either fruit to continue.</p>
      <div class="tutorial-options">
        <button id="tutorialApple" class="tutorial-option" aria-label="Apple">
          <span id="tutorialAppleProbability" class="tutorial-probability hidden">80%</span>
          <img src="assets/apple.png" alt="Apple">
        </button>
        <button id="tutorialBanana" class="tutorial-option" aria-label="Banana">
          <span id="tutorialBananaProbability" class="tutorial-probability hidden">20%</span>
          <img src="assets/banana.png" alt="Banana">
        </button>
      </div>
      <div class="center">
        <button id="tutorialContinue" class="hidden">Continue</button>
        <button id="start" class="hidden">Start practice</button>
      </div>
    </section>

    <section id="task" class="hidden">
      <div id="experimentProgress" class="experiment-progress" role="progressbar" aria-label="Experiment progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="experimentProgressBar" class="experiment-progress-bar"></div>
      </div>
      <div class="top">
        <span id="progress"></span>
        <span id="score" class="score"><img src="assets/total-coins.png" alt="Gold coins"><span id="scoreValue">0</span></span>
      </div>
      <div id="prompt" class="prompt">Choose one</div>
      <div class="options">
        <button id="left" class="option">
          <img class="stimulus" alt="">
        </button>
        <button id="right" class="option">
          <img class="stimulus" alt="">
        </button>
      </div>
      <div id="feedback" class="feedback hidden" aria-live="polite">
        <img id="coinReward" class="coin-reward hidden" src="assets/reward-coin.png" alt="Gold reward coin">
        <p id="feedbackText"></p>
        <button id="nextTrial">Next trial</button>
      </div>
      <p id="saveError" class="save-error"></p>
    </section>

    <section id="complete" class="card hidden">
      <h1>Experiment complete</h1>
      <img class="complete-coins" src="assets/total-coins.png" alt="Stack of gold coins">
      <p id="finalScore" class="subtitle"></p>
      <p class="subtitle">Your results have been saved.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
